global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: eligibility-api
    metrics_path: /metrics
    # Set METRICS_TOKEN in .env; the same value protects /metrics and authenticates this scrape.
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8000"]
