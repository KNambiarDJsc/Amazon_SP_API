[project]
name = "amazon-sp-eligibility"
version = "0.1.0"
description = "Self-hostable Amazon India seller eligibility checker (ASIN-level, evidence-backed)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "dramatiq[redis]>=1.17",
  "redis>=5.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
markers = ["browser: drives a real Chromium against an offline fake site (slower; deselect with -m 'not browser')"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/fake_sellercentral.py" = ["E501"]  # embedded HTML/JS fixture
