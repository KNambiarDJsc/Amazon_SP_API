name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eligibility_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eligibility_test
      REDIS_TEST_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,browser]"
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      # Full suite: real PostgreSQL (migration drift, concurrency races), real Redis, real Chromium.
      - run: pytest -q
      - run: pip-audit --progress-spinner off --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # format, types, the generated API client matches openapi.json, unit tests, production build
      - run: npm run verify
      - run: npm audit

  e2e:
    # The dashboard's browser suite against the full Docker deployment (Caddy -> API -> worker).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install openpyxl
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/e2e_compose.sh --down
      - if: failure()
        run: docker compose --env-file .env.e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file and the example environment are consistent
        run: |
          sed 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=x/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=y/' .env.example > /tmp/ci.env
          docker compose --env-file /tmp/ci.env config -q
          docker compose --env-file /tmp/ci.env --profile monitoring config -q
      - name: Alert rules are valid
        run: docker run --rm --entrypoint promtool -v "$PWD/docker:/c:ro" prom/prometheus:v2.55.1 check rules /c/prometheus-rules.yml
      - name: Caddyfile is valid
        run: docker run --rm -e SITE_ADDRESS=:80 -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
